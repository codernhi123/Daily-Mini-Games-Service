name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    name: CI workflow
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Create .env file from Secrets
        run: |
          echo "POSTGRES_HOST=db" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "STORAGE_SECRET=${{ secrets.STORAGE_SECRET }}" >> .env
          echo "JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}" >> .env

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python -m pip install --upgrade pip   
      
      - name: Set up docker container
        run: docker compose up -d --build

      - name: Check environment inside web container
        run: docker compose exec web env

      - name: Linting with ruff
        run: docker compose exec web ruff check .
      
      ##- name: Running pytests
      ##  run: docker compose exec web pytest --maxfail=1
      
      - name: Display container logs if tests fail
        if: failure()
        run: |
          docker compose logs web
          docker compose logs db