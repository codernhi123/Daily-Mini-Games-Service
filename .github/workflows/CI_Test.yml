name: CI

on:
  push:
    branches:
        - main
  pull_request:
    branches:
        - main

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: db
      POSTGRES_USER: Group14
      POSTGRES_PASSWORD: Group14

    name: CI workflow
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python -m pip install --upgrade pip  
      
      - name: Set up docker container
        run: docker compose up -d --build

      - name: Check environment inside web container
        run: docker compose exec web env

      - name: Linting with ruff
        run: docker compose exec web ruff check .
      
      - name: Running pytests
        run: docker compose exec web pytest --maxfail=1
      
      - name: Display container logs if tests fail
        if: failure()
        run: |
          docker compose logs web



