services:
  db:
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data # Persists data to a named volume
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: db # The service name of your Postgres container
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}       # <--- Added this
      STORAGE_SECRET: ${STORAGE_SECRET}  # <--- Added this
      ADMIN_PASSWORD: ${ADMIN_PASSWORD} # <--- Added this
    develop:
      watch:
        - action: sync+restart
          path: ./
          target: /app/

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: 
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - web
    develop:
      watch: 
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data: # Defines the named volume for data persistence

